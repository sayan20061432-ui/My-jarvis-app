name: Build Jarvis APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get Architecture Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev gawk cmake libasound2-dev

      - name: Install Buildozer compiler
        run: |
          pip3 install --upgrade pip
          pip3 install "cython<3.0.0"
          pip3 install buildozer Kivy

      - name: Build Android Package Matrix
        run: |
          # This automatically answers "yes" to all Android SDK license prompts
          yes | buildozer android debug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-Package
          path: bin/*.apk

          
